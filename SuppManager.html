<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SuppManager</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2420;--mu:#68736c;--bd:#e0e4de;--ac:#2f7d5b;--ok:#2f7d5b;--wa:#c98a14;--er:#c2412f;--chip:#eef1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1e2622;--tx:#eaf0ec;--mu:#98a59d;--bd:#2d3832;--ac:#4cb88a;--ok:#4cb88a;--wa:#e0a93a;--er:#e8705e;--chip:#27312c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1e2622;--tx:#eaf0ec;--mu:#98a59d;--bd:#2d3832;--ac:#4cb88a;--ok:#4cb88a;--wa:#e0a93a;--er:#e8705e;--chip:#27312c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.today li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.today li:last-child{border:0}
ul{list-style:none;margin:0;padding:0}
.name{font-weight:600;font-size:17px}
.meta{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.days{display:flex;gap:4px;margin-top:6px}
.days span{font-size:11px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--mu)}
.days span.on{background:var(--ac);color:#fff}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.d{color:var(--er)}
.add{width:100%;padding:13px;font-size:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 10px;min-width:44px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.empty{text-align:center;color:var(--mu);padding:24px 8px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>SuppManager</h1>
<p class="sub" id="sub"></p>

<div class="card today" id="todayCard"><h2>Da prendere oggi</h2><ul id="today"></ul></div>
<div class="card" id="costCard"><div class="row"><span class="meta">Spesa stimata al mese</span><b id="cost">–</b></div></div>

<button class="add p" id="addBtn">+ Aggiungi integratore</button>

<div class="card hidden" id="form">
  <h2 id="formTitle">Nuovo integratore</h2>
  <label>Nome</label><input id="fName" placeholder="es. Creatina">
  <div class="g2">
    <div><label>Unità</label><select id="fUnit"><option>g</option><option>capsule</option><option>compresse</option><option>ml</option></select></div>
    <div><label>Dose per assunzione</label><input id="fDose" type="number" step="any" min="0" value="5"></div>
  </div>
  <div class="g2">
    <div><label>Contenuto confezione</label><input id="fPack" type="number" step="any" min="0" value="300"></div>
    <div><label>Rimasto ora</label><input id="fQty" type="number" step="any" min="0" value="300"></div>
  </div>
  <label>Giorni di assunzione</label>
  <div class="chips" id="fDays"></div>
  <label>Prezzo confezione (€, facoltativo)</label><input id="fPrice" type="number" step="any" min="0">
  <div class="btns"><button class="p" id="save">Salva</button><button id="cancel">Annulla</button></div>
</div>

<div id="list"></div>
</main>

<script>
var DN=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'],KEY='suppmanager_v1',items=[],editId=null,fDays=[0,1,2,3,4,5,6];
function load(){try{var r=localStorage.getItem(KEY);items=r?JSON.parse(r):[]}catch(e){items=[]}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function todayD(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function idx(d){return (d.getDay()+6)%7}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmt(d){return d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})}
function num(n){return (Math.round(n*10)/10).toString().replace('.',',')}
// stock now: subtract scheduled doses from asOf up to yesterday
function current(it){var rem=it.qty,t=todayD();for(var d=parse(it.asOf);d<t;d=addDays(d,1)){if(it.days.indexOf(idx(d))>-1)rem-=it.dose}return Math.max(0,rem)}
// simulate forward: first scheduled day when stock is not enough for a full dose
function project(it){var rem=current(it);if(!(it.dose>0)||!it.days.length)return null;var t=todayD();for(var i=0;i<1500;i++){var d=addDays(t,i);if(it.days.indexOf(idx(d))>-1){if(rem<it.dose-1e-9)return {date:d,left:i};rem-=it.dose}}return {date:addDays(t,1500),left:1500}}
function avgDaily(it){return it.dose*it.days.length/7}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function render(){
  var t=todayD(),ti=idx(t);
  document.getElementById('sub').textContent=t.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  var td=items.filter(function(i){return i.days.indexOf(ti)>-1});
  document.getElementById('todayCard').classList.toggle('hidden',!items.length);
  document.getElementById('today').innerHTML=td.length?td.map(function(i){return '<li><span>'+esc(i.name)+'</span><b>'+num(i.dose)+' '+i.unit+'</b></li>'}).join(''):'<li class="meta">Niente in programma oggi.</li>';
  var cost=0,hasCost=false;
  items.forEach(function(i){if(i.price>0&&i.pack>0){cost+=i.price*avgDaily(i)/i.pack*30.44;hasCost=true}});
  document.getElementById('costCard').classList.toggle('hidden',!hasCost);
  document.getElementById('cost').textContent='€ '+cost.toFixed(2).replace('.',',');
  var el=document.getElementById('list');
  if(!items.length){el.innerHTML='<div class="empty">Nessun integratore. Aggiungi il primo per vedere quando finirà.</div>';return}
  var rows=items.map(function(i){var p=project(i),cur=current(i),pct=i.pack>0?Math.min(100,cur/i.pack*100):0;return {i:i,p:p,cur:cur,pct:pct}});
  rows.sort(function(a,b){return (a.p?a.p.left:9999)-(b.p?b.p.left:9999)});
  el.innerHTML=rows.map(function(r){
    var i=r.i,p=r.p,col='var(--ok)',txt='';
    if(!p){txt='Nessuna assunzione';col='var(--mu)'}
    else if(p.left===0){txt='Finito';col='var(--er)'}
    else{txt=p.left+(p.left===1?' giorno':' giorni');col=p.left<=7?'var(--er)':p.left<=14?'var(--wa)':'var(--ok)'}
    var note=!p?'':p.left>=1500?'Scorta sufficiente a lungo':(p.left<=14?'Riordina entro il '+fmt(addDays(p.date,-3)):'Finisce il '+fmt(p.date));
    return '<div class="card"><div class="row"><div><div class="name">'+esc(i.name)+'</div><div class="meta">'+num(i.dose)+' '+i.unit+' per assunzione · media '+num(avgDaily(i))+' '+i.unit+'/giorno</div></div><span class="badge" style="background:'+col+'">'+txt+'</span></div>'
    +'<div class="bar"><i style="width:'+r.pct+'%;background:'+col+'"></i></div>'
    +'<div class="row meta"><span>Rimasti: '+num(r.cur)+' / '+num(i.pack)+' '+i.unit+'</span><span>'+note+'</span></div>'
    +'<div class="days">'+DN.map(function(n,k){return '<span class="'+(i.days.indexOf(k)>-1?'on':'')+'">'+n[0]+'</span>'}).join('')+'</div>'
    +'<div class="btns"><button class="p" data-a="refill" data-id="'+i.id+'">+ Confezione</button><button data-a="edit" data-id="'+i.id+'">Modifica</button><button class="d" data-a="del" data-id="'+i.id+'">Elimina</button></div></div>';
  }).join('');
}

function drawDays(){document.getElementById('fDays').innerHTML=DN.map(function(n,k){return '<button type="button" data-d="'+k+'" class="'+(fDays.indexOf(k)>-1?'on':'')+'">'+n+'</button>'}).join('')}
function openForm(it){
  editId=it?it.id:null;
  document.getElementById('formTitle').textContent=it?'Modifica integratore':'Nuovo integratore';
  var v=function(id,x){document.getElementById(id).value=x};
  v('fName',it?it.name:'');v('fUnit',it?it.unit:'g');v('fDose',it?it.dose:5);v('fPack',it?it.pack:300);
  v('fQty',it?num(current(it)).replace(',','.'):300);v('fPrice',it&&it.price?it.price:'');
  fDays=it?it.days.slice():[0,1,2,3,4,5,6];drawDays();
  document.getElementById('form').classList.remove('hidden');
  document.getElementById('addBtn').classList.add('hidden');
  window.scrollTo(0,0);
}
function closeForm(){document.getElementById('form').classList.add('hidden');document.getElementById('addBtn').classList.remove('hidden')}

document.getElementById('addBtn').onclick=function(){openForm(null)};
document.getElementById('cancel').onclick=closeForm;
document.getElementById('fDays').onclick=function(e){var b=e.target.closest('button');if(!b)return;var k=+b.dataset.d,p=fDays.indexOf(k);if(p>-1)fDays.splice(p,1);else fDays.push(k);drawDays()};
document.getElementById('save').onclick=function(){
  var g=function(id){return document.getElementById(id).value};
  var name=g('fName').trim();if(!name){alert('Inserisci un nome');return}
  var o={name:name,unit:g('fUnit'),dose:parseFloat(g('fDose'))||0,pack:parseFloat(g('fPack'))||0,qty:parseFloat(g('fQty'))||0,days:fDays.slice().sort(),price:parseFloat(g('fPrice'))||0,asOf:ymd(todayD())};
  if(editId){items=items.map(function(i){return i.id===editId?Object.assign({},i,o):i})}else{o.id='s'+Date.now();items.push(o)}
  store();closeForm();render();
};
document.getElementById('list').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;var id=b.dataset.id,it=items.filter(function(i){return i.id===id})[0];if(!it)return;
  if(b.dataset.a==='edit')openForm(it);
  else if(b.dataset.a==='del'){if(confirm('Eliminare '+it.name+'?')){items=items.filter(function(i){return i.id!==id});store();render()}}
  else if(b.dataset.a==='refill'){it.qty=current(it)+it.pack;it.asOf=ymd(todayD());store();render()}
};
load();render();
</script>
</body>
</html>
